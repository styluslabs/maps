# Offline routing configuration (app/src/offlinerouter.cpp), for the Ascend tile schema (geodesk ascendtiles.cpp)
# - filters use the same syntax as draw rules; JS function filters are not supported
# - speed: first matching rule sets speed in km/h; value 0 (or no matching rule) means not allowed
# - factor: cost (time) is multiplied by value of every matching rule; > 1 to avoid
# - oneway: ways matching filter (and not except) can only be traversed forward
# - maxspeed: speed = min(scale*maxspeed, max_factor*speed) if attribute is present (before factors)
# - name: attributes used for way name in directions; unnamed ways are "the " + labels[label_key value]
#  (label_key value with '_' replaced by ' ' if not in labels)
# - elevation: if the map has an elevation source, route points get elevations and profiles can set
#  climb: { up: seconds per meter of ascent, down: seconds per meter of descent }; down < 0 makes descents faster,
#  but not faster than max_speed (km/h; higher values make search slower).  Ascent and descent along a way ignore
#  ups and downs smaller than elevation.threshold (meters), and ways matching elevation.linear (bridges, tunnels)
#  only use elevation at their endpoints.  elevation.zoom is the zoom of elevation tiles used.

application:
    routing:
        source: osm
        layer: transportation
        zoom: 14
        filter: { highway: true }
        name: [name, ref]
        label_key: highway
        labels:
            trunk: trunk road
            primary: road
            secondary: road
            tertiary: road
            unclassified: road
            residential: road
            living_street: street
            service: service road
            pedestrian: pedestrian street
        elevation:
            zoom: 12
            threshold: 5
            linear: { brunnel: [bridge, tunnel] }

        profiles:
            walk:
                # Naismith's rule: +1 hour per 600 m of ascent; steep descents are slower too
                climb: { up: 6, down: 1 }
                speed:
                    - { filter: { highway: [motorway, trunk] }, value: 0 }
                    - { value: 5 }
                factor:
                    - { filter: { highway: primary }, value: 1.3 }
                    - { filter: { highway: secondary }, value: 1.2 }
                    - { filter: { highway: steps }, value: 1.4 }
                    # tiles only include the more difficult sac_scale grades
                    - { filter: { sac_scale: demanding_mountain_hiking }, value: 1.5 }
                    - { filter: { sac_scale: alpine_hiking }, value: 2.5 }
                    - { filter: { sac_scale: [demanding_alpine_hiking, difficult_alpine_hiking] }, value: 4 }
                    - { filter: { trail_visibility: [bad, horrible, no] }, value: 1.5 }

            bike:
                # ~3 s/m: about 9 km/h at 6% grade; descents up to 30 km/h
                climb: { up: 3, down: -1.5, max_speed: 30 }
                oneway:
                    filter: { oneway: 1 }
                    except:
                        - { cycleway: [opposite, opposite_lane, opposite_track] }
                        - { cycleway_left: [opposite, opposite_lane, opposite_track] }
                        - { cycleway_right: [opposite, opposite_lane, opposite_track] }
                speed:
                    - { filter: { highway: [motorway, trunk] }, value: 0 }
                    - { filter: { sac_scale: true }, value: 2 }
                    - { filter: { highway: steps }, value: 2 }
                    - { filter: { mtb_scale: ["3", "3+", "4", "4+", "5", "6"] }, value: 4 }
                    - { filter: { highway: cycleway }, value: 18 }
                    - filter:
                          highway: primary
                          any: [{ cycleway: true }, { cycleway_left: true }, { cycleway_right: true }]
                      value: 14
                    - { filter: { highway: primary }, value: 8 }
                    - filter:
                          highway: secondary
                          any: [{ cycleway: true }, { cycleway_left: true }, { cycleway_right: true }]
                      value: 15
                    - { filter: { highway: secondary }, value: 11 }
                    - { filter: { highway: tertiary }, value: 14 }
                    - { filter: { highway: living_street }, value: 12 }
                    - { filter: { highway: service }, value: 13 }
                    - { filter: { highway: track, surface: paved }, value: 15 }
                    - { filter: { highway: track }, value: 11 }
                    - { filter: { highway: bridleway }, value: 8 }
                    - { filter: { highway: path, bicycle: [yes, designated, permissive] }, value: 14 }
                    - { filter: { highway: path }, value: 8 }
                    - { filter: { highway: [footway, pedestrian], bicycle: [yes, designated, permissive] }, value: 13 }
                    - { filter: { highway: [footway, pedestrian] }, value: 5 }  # push the bike
                    - { value: 16 }
                factor:
                    - { filter: { surface: unpaved, not: { highway: [track, path] } }, value: 1.3 }

            drive:
                oneway:
                    filter: { oneway: 1 }
                maxspeed: { key: maxspeed, scale: 0.85, max_factor: 1.5 }
                speed:
                    - { filter: { highway: motorway }, value: 105 }
                    - { filter: { highway: trunk }, value: 85 }
                    - { filter: { highway: primary }, value: 65 }
                    - { filter: { highway: secondary }, value: 55 }
                    - { filter: { highway: tertiary }, value: 45 }
                    - { filter: { highway: unclassified }, value: 35 }
                    - { filter: { highway: [residential, road] }, value: 25 }
                    - { filter: { highway: living_street }, value: 10 }
                    - { filter: { highway: service, service: [parking_aisle, driveway] }, value: 8 }
                    - { filter: { highway: service }, value: 15 }
                    # tracks are often closed to cars, but tiles don't have access tags
                    - { filter: { highway: track, surface: paved }, value: 15 }
                    - { filter: { highway: track }, value: 6 }
                factor:
                    - { filter: { ramp: 1 }, value: 1.43 }
                    - { filter: { surface: unpaved, not: { highway: track } }, value: 1.67 }
